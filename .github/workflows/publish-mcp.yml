name: Publish MCP Server to Registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'products/mcp-server/server.json'
      - 'products/mcp-server/package.json'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MCP Publisher
        run: |
          curl -sL $(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r '.assets[] | select(.name == "mcp-publisher_linux_amd64.tar.gz") | .browser_download_url') | tar xz
          chmod +x mcp-publisher

      - name: Login with GitHub OIDC
        working-directory: products/mcp-server
        run: ../../mcp-publisher login github-oidc

      - name: Validate server.json
        working-directory: products/mcp-server
        run: ../../mcp-publisher validate

      - name: Publish to MCP Registry
        working-directory: products/mcp-server
        run: ../../mcp-publisher publish
