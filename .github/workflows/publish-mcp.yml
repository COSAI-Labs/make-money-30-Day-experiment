name: Publish MCP Server to Registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'products/mcp-server/server.json'
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MCP Publisher
        run: |
          curl -L -o /tmp/mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp
          chmod +x /tmp/mcp-publisher

      - name: Login with GitHub OIDC
        working-directory: products/mcp-server
        run: /tmp/mcp-publisher login github-oidc

      - name: Validate server.json
        working-directory: products/mcp-server
        run: /tmp/mcp-publisher validate

      - name: Publish to MCP Registry
        working-directory: products/mcp-server
        run: /tmp/mcp-publisher publish
