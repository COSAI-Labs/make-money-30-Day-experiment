<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#333}nav{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;font-size:.9rem}nav a{color:#6c63ff;text-decoration:none}.container{max-width:900px;margin:0 auto;padding:20px}h1{font-size:2rem;text-align:center;margin:32px 0 8px}.sub{text-align:center;color:#666;margin-bottom:32px}.box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}textarea,input[type=text],input[type=number],select{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;font-family:'Courier New',monospace;font-size:.9rem}textarea{min-height:150px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:#6c63ff}.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.btn{padding:10px 20px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:.9rem}.bp{background:#6c63ff;color:#fff}.bp:hover{background:#5a52d5}.bs{background:#eee;color:#333}.bs:hover{background:#ddd}.out{margin-top:12px}label{font-weight:500;margin-bottom:6px;display:block}.cnt{margin-top:48px;line-height:1.7}.cnt h2{margin:24px 0 12px;font-size:1.3rem}.cnt p{margin-bottom:12px;color:#555}footer{text-align:center;padding:40px;color:#999;font-size:.85rem}footer a{color:#6c63ff;text-decoration:none;margin:0 8px}</style></head><body>
<nav><a href="/">ToolPipe</a><div><a href="/tools">All Tools</a> | <a href="/api-keys">API</a></div></nav>
<div class="container"><h1>Countdown Timer</h1><p class="sub">Set a countdown timer for any duration</p><div class="box"><div style="display:flex;gap:12px;margin-bottom:16px"><div style="flex:1"><label>Minutes</label><input type="number" id="mins" value="5" min="0"></div><div style="flex:1"><label>Seconds</label><input type="number" id="secs" value="0" min="0" max="59"></div></div><div class="btns"><button class="btn bp" onclick="start()">Start</button><button class="btn bs" onclick="stop()">Stop</button><button class="btn bs" onclick="reset()">Reset</button></div><div style="text-align:center;padding:32px;margin-top:16px;background:#f0f0f0;border-radius:8px"><div id="display" style="font-size:4rem;font-weight:700;color:#6c63ff;font-family:monospace">05:00</div></div></div><div class="cnt"><h2>About This Tool</h2><p>Free online Countdown Timer tool. No signup required. Runs entirely in your browser.</p></div></div>

<script>let timer,total=300;function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function start(){stop();total=parseInt(document.getElementById("mins").value)*60+parseInt(document.getElementById("secs").value);document.getElementById("display").textContent=fmt(total);timer=setInterval(()=>{if(--total<=0){stop();document.getElementById("display").style.color="#ef4444"}document.getElementById("display").textContent=fmt(total)},1000)}function stop(){clearInterval(timer)}function reset(){stop();total=parseInt(document.getElementById("mins").value)*60+parseInt(document.getElementById("secs").value);document.getElementById("display").textContent=fmt(total);document.getElementById("display").style.color="#6c63ff"}</script></body></html>
