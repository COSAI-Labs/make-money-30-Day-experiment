<div class="container"><h1>Hex Color Picker</h1><p class="sub">Pick any color and get its hex, RGB, and HSL values</p><div class="box"><input type="color" id="cp" value="#6c63ff" oninput="pick()" style="width:100%;height:60px;cursor:pointer;border:none"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px"><div style="text-align:center;padding:12px;background:#f0f0f0;border-radius:8px"><div style="font-weight:600">HEX</div><div id="hex" style="font-family:monospace;font-size:1.1rem">#6C63FF</div></div><div style="text-align:center;padding:12px;background:#f0f0f0;border-radius:8px"><div style="font-weight:600">RGB</div><div id="rgb" style="font-family:monospace">108, 99, 255</div></div><div style="text-align:center;padding:12px;background:#f0f0f0;border-radius:8px"><div style="font-weight:600">HSL</div><div id="hsl" style="font-family:monospace">243, 100%, 69%</div></div></div></div><div class="cnt"><h2>About This Tool</h2><p>Free online Hex Color Picker tool. No signup required. Runs entirely in your browser.</p></div></div>

<script>function pick(){const v=document.getElementById("cp").value;document.getElementById("hex").textContent=v.toUpperCase();const r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);document.getElementById("rgb").textContent=r+", "+g+", "+b;const rn=r/255,gn=g/255,bn=b/255,mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===rn)h=((gn-bn)/d+(gn<bn?6:0))/6;else if(mx===gn)h=((bn-rn)/d+2)/6;else h=((rn-gn)/d+4)/6}document.getElementById("hsl").textContent=Math.round(h*360)+", "+Math.round(s*100)+"%, "+Math.round(l*100)+"%"}</script></body></html>
