<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Line Counter</title>
<meta name="description" content="Count lines in text">
<link rel="canonical" href="/line-counter">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#333}nav{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;font-size:.9rem}nav a{color:#6c63ff;text-decoration:none}.container{max-width:900px;margin:0 auto;padding:20px}h1{font-size:2rem;text-align:center;margin:32px 0 8px}.sub{text-align:center;color:#666;margin-bottom:32px}.box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}textarea,input[type=text],input[type=number],select{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;font-family:'Courier New',monospace;font-size:.9rem}textarea{min-height:150px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:#6c63ff}.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.btn{padding:10px 20px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:.9rem}.bp{background:#6c63ff;color:#fff}.bp:hover{background:#5a52d5}.bs{background:#eee;color:#333}.bs:hover{background:#ddd}.out{margin-top:12px}label{font-weight:500;margin-bottom:6px;display:block}.cnt{margin-top:48px;line-height:1.7}.cnt h2{margin:24px 0 12px;font-size:1.3rem}.cnt p{margin-bottom:12px;color:#555}footer{text-align:center;padding:40px;color:#999;font-size:.85rem}footer a{color:#6c63ff;text-decoration:none;margin:0 8px}</style></head><body>
<nav><a href="/">ToolPipe</a><div><a href="/tools">All Tools</a> | <a href="/api-keys">API</a></div></nav>
<div class="container"><h1>Line Counter</h1><p class="sub">Count the number of lines in your text</p><div class="box"><label>Text</label><textarea id="i" oninput="run()" placeholder="Paste text to count lines..."></textarea><div style="display:flex;gap:12px;margin-top:16px"><div style="flex:1;text-align:center;padding:16px;background:#f0f0f0;border-radius:8px"><div style="font-size:2rem;font-weight:700;color:#6c63ff" id="total">0</div><div style="color:#666">Total Lines</div></div><div style="flex:1;text-align:center;padding:16px;background:#f0f0f0;border-radius:8px"><div style="font-size:2rem;font-weight:700;color:#6c63ff" id="nonempty">0</div><div style="color:#666">Non-Empty</div></div><div style="flex:1;text-align:center;padding:16px;background:#f0f0f0;border-radius:8px"><div style="font-size:2rem;font-weight:700;color:#6c63ff" id="empty">0</div><div style="color:#666">Empty Lines</div></div></div></div><div class="cnt"><h2>About This Tool</h2><p>Free online Line Counter tool. No signup required. Runs entirely in your browser.</p></div></div>
<footer><a href="/">ToolPipe</a> | <a href="/json-formatter">JSON</a> | <a href="/regex-tester">Regex</a> | <a href="/qr-code-generator">QR</a> | <a href="/pricing">Pricing</a></footer>
<script>function run(){const t=document.getElementById("i").value;const lines=t?t.split("\n"):[];document.getElementById("total").textContent=lines.length;const ne=lines.filter(l=>l.trim()).length;document.getElementById("nonempty").textContent=ne;document.getElementById("empty").textContent=lines.length-ne}</script></body></html>
