    <script>
    // Simple Markdown parser
    function parseMd(md) {
        let html = md
            // Code blocks
            .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
                `<pre><code class="language-${lang}">${esc(code.trim())}</code></pre>`)
            // Inline code
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            // Headers
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h1>$1</h1>')
            // Bold, italic, strikethrough
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/~~(.+?)~~/g, '<del>$1</del>')
            // Links
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
            // Images
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
            // HR
            .replace(/^---$/gm, '<hr>')
            // Blockquotes
            .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
            // Unordered lists
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/^  - (.+)$/gm, '<li style="margin-left:20px">$1</li>')
            // Ordered lists
            .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
            // Tables
            .replace(/^\|(.+)\|$/gm, (match) => {
                const cells = match.split('|').filter(c => c.trim());
                if (cells.every(c => /^[-:\s]+$/.test(c))) return '';
                const tag = match.includes('---') ? 'td' : 'td';
                return '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
            });

        // Wrap consecutive li in ul/ol
        html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
        // Wrap consecutive tr in table
        html = html.replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g, match => `<table>${match}</table>`);
        // Merge consecutive blockquotes
        html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');
        // Paragraphs
        html = html.split('\n\n').map(block => {
            block = block.trim();
            if (!block) return '';
            if (/^<[hupoltbdi]/.test(block)) return block;
            return `<p>${block}</p>`;
        }).join('\n');

        return html;
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function render() {
        document.getElementById('preview').innerHTML = parseMd(document.getElementById('editor').value);
    }

    function copyMd() {
        navigator.clipboard.writeText(document.getElementById('editor').value);
    }

    function copyHtml() {
        navigator.clipboard.writeText(document.getElementById('preview').innerHTML);
    }

    render();
    </script>
